name: neuro-conda-2025b
channels:
  - conda-forge
dependencies:

  # (-1) System Dependencies (non-Python)
  - hdf5=1.14.*

  # (0) System Dependencies (Python)
  - python=3.12.*
  - pip
  - numcodecs
  - scipy=1.16.*
  - numpy=2.3.*
  - cython
  - mpi4py=4.1.*
  - matplotlib=3.10.*
  - seaborn
  - pandas=2.3.*
  - opencv=4.12.*

  # (1) Electrophysiology (LFP + M/EEG)
  - mne-nirs=0.7.*
  - mne-connectivity=0.7.*
  - mne-features=0.3.*
  - mne-ari=0.1.*
  - mne-microstates=0.3.*
  - neurokit2=0.2.*
  - pyprep=0.5.*
  - pactools=0.3.*
  
  # (3) Neuroimaging
  - dipy=1.11.*
  - nilearn=0.12.*
  - nipype=1.10.*

  # (4) Simulation / Computational neuroscience
  - brian2=2.9.*

  # (5) File/data formats
  - pynwb=3.1.*
  - deid=0.4.*
  - imageio=2.37.*

  # (6) Tools: Development
  - bokeh=3.8.*
  - flake8=7.*
  - pep8-naming=0.15.*
  - black=25.1.*
  - jupyter
  - ipympl
  - marimo

  - pip:
      - psutils

      # (1) Electrophysiology (LFP + M/EEG)
      - mne==1.10.*
      - mne-icalabel==0.8.*
      - fooof==1.1.*
      - bycycle==1.2.*
      - pynapple==0.10.*
      - alphacsc==0.4.*
      - nitime==0.12.*; platform_system != "Darwin"
      - open-ephys-python-tools==1.0.*

      # (2) Electrophysiology (spikes + LFP)
      # - elephant[extras]==1.1.*
      # - viziphant==0.4.*
      - neurodsp==2.3.*

      # (3) Neuroimaging
      - intensity-normalization==3.0.*

      # (5) File/data formats
      - nixio==1.5.*
      - neo==0.14.*
      - pybids==0.21.*
      - mat73==0.65.*
      - sbxreader==0.2.*

      # (4) Simulation / Computational neuroscience

      # Tools: Machine Learning
      
      # Tools: Parallelization
      - esi-acme==2025.11.*

      # Unsorted
      - pytest==9.0.*
      - ephyviewer==1.7.*
      - pywavelets==1.9.*
      - dataconf==3.6.*
      - napari-nibabel==0.1.*
