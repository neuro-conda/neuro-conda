name: neuro-conda-2025b
channels:
  - conda-forge
dependencies:
  
  # (-1) System Dependencies (non-Python)
  - qt6-main=6.10.* 
  - hdf5=1.14.*

  # (0) System Dependencies (Python)
  - python=3.12.*
  - pip
  - numcodecs=0.15.*
  - scipy=1.16.*
  - numpy=2.3.*
  - cython=3.2.*
  - mpi4py=4.1.*
  - matplotlib=3.10.*
  - seaborn=0.13.*
  - pandas=2.3.*

  # (1) Electrophysiology (LFP + M/EEG)
  - mne==1.10.* 
  - mne-rsa=0.10
  - mne-nirs=0.7.*
  - mne-icalabel=0.8.*
  - mne-connectivity=0.7.*
  - mne-features=0.3.*
  - mne-bids-pipeline=1.9.*
  - mne-ari=0.1.*
  - mne-microstates=0.3
  - neurokit2=0.2.*
  - pyprep=0.5.*
  - pactools=0.3.*

  # (3) Neuroimaging
  - dipy=1.11.*
  - nilearn=0.12.*
  - nipype=1.10.*

  # (4) Simulation / Computational neuroscience
  - brian2=2.9.*

  # (5) File/data formats
  - pynwb=3.1.*
  - deid=0.4.*
  - imageio=2.37.*  

  # (6) Tools: Development
  - bokeh=3.8.*
  - flake8=7.3.*
  - pep8-naming=0.15.*
  - black=25.1.*
  - ruamel.yaml=0.18.*
  - jupyter=1.1.*
  - ipympl=0.9.*
  - marimo=0.18.*

  - pip:
      # (1) Electrophysiology (LFP + M/EEG)
      - eelbrain==0.41.*; platform_machine != "ppc64le"
      - fooof==1.1.*
      - bycycle==1.2.*      
      - pynapple==0.10.*
      - invertmeeg==0.1.*; platform_system == "Linux"
      - alphacsc==0.4.*
      - nitime==0.12.*; platform_system != "Darwin"
      - open-ephys-python-tools==1.0.*

      # (2) Electrophysiology (spikes + LFP)
      - spikeinterface[full]==0.103.* 
      - spikeinterface-gui==0.12.*
      - neurodsp==2.3.* 

      # (3) Neuroimaging
      - intensity-normalization==3.0.*      

      # (5) File/data formats
      - nixio==1.5.*
      - neo==0.14.*
      - pybids==0.21.*
      - mat73==0.65
      - h5py==3.15.*
      - sbxreader==0.2.*

      # (4) Simulation / Computational neuroscience

      # Tools: Machine Learning
      - braindecode==1.2.*; platform_system == "Linux" and platform_machine != "ppc64le"
      - scikit-learn==1.8.*; platform_system == "Linux" and platform_machine != "ppc64le"
      - scikit-learn-intelex==2025.10.*; platform_machine == "x86_64" and platform_system != "Darwin"
      - torch==2.9.*; platform_system == "Linux" and platform_machine != "ppc64le"
      - opencv-python==4.12.*; platform_system == "Linux" and platform_machine != "ppc64le"
      - torchvision==0.24.*; platform_system == "Linux" and platform_machine != "ppc64le"
      - torchaudio==2.9.*; platform_system == "Linux" and platform_machine != "ppc64le"
      - tensorflow==2.20.*; platform_system == "Linux" and platform_machine != "ppc64le"
      - tensorflow_datasets==4.9.*; platform_system == "Linux" and platform_machine != "ppc64le"

      # Tools: Parallelization
      - esi-acme==2025.11
      - dask==2025.11.*

      # Unsorted      
      - pytest==9.0.*
      - ephyviewer==1.7.*
      - pywavelets==1.9.*
      - dataconf==3.6.*
      - scikit-image==0.25.*
      - napari-nibabel==0.1.*